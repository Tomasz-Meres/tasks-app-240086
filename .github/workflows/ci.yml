name: Test and Scan
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
permissions:
  contents: read
jobs:
  run-tests:
    runs-on: ubuntu-latest
    strategy: 
      matrix: 
        services: [tasks-api, title-normalizer] # $((matrix service))
        python-version: ["3.10", "3.11", "3.12"] # $((matrix python-version))
    steps: 
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: $((matrix.python-version))
      - run: |
          python -m pip install --upgrade pip
          pip install -r services/$((matrix.service))/requirements.txt
      - run: |
          pytest services/$((matrix service))

